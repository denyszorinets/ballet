name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: "**/go.sum"
      - run: make go-check

  docker:
    name: Runner (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: "**/go.sum"
      # GitHub-hosted runners have Docker: test the Docker backend for real.
      - run: make runner-docker-test

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make images
      - run: docker compose -f deploy/compose.yaml config --quiet

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The realtime client's integration tests build kit/rpc/cmd/rpc-testserver.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: "**/go.sum"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('web/bun.lock') }}
      - run: make web-install
      - run: make web-check
      - run: make web-build

  e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('web/bun.lock') }}
      - run: make web-install
      # GitHub-hosted Ubuntu runners ship Google Chrome, used via channel "chrome".
      - run: make web-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock
      - run: make docs-check
