      parameters:
        - { name: scope, in: query, required: true, schema: { type: string }, description: "platform, customer:<key> or project:<key>" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SkillList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSkill
      tags: [skills]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSkill" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/skills/{skill}:
    parameters: [{ $ref: "#/components/parameters/Skill" }]
    get:
      operationId: getSkill
      tags: [skills]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSkillDraft
      tags: [skills]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSkillDraft" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/skills/{skill}/publish:
    parameters: [{ $ref: "#/components/parameters/Skill" }]
    post:
      operationId: publishSkill
      tags: [skills]
      summary: Snapshot the draft as the next immutable version
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PublishSkill" } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/SkillVersion" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/skills/{skill}/versions:
    parameters: [{ $ref: "#/components/parameters/Skill" }]
    get:
      operationId: listSkillVersions
      tags: [skills]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SkillVersionList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/skills/{skill}/versions/{number}:
    parameters:
      - { $ref: "#/components/parameters/Skill" }
      - { name: number, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSkillVersion
      tags: [skills]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SkillVersion" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/skills:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: resolveProjectSkills
      tags: [skills]
      summary: The project's effective skills (platform → customer → project, pins applied)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ResolvedSkillList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/skill-pins:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listProjectSkillPins
      tags: [skills]
      summary: The project's pins, including disabled skills (which resolution leaves out)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSkillPinList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/skills/{name}/pin:
    parameters:
      - { $ref: "#/components/parameters/Project" }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      operationId: pinProjectSkill
      tags: [skills]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillPin" } } }
      responses:
        "204": { description: Pinned }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unpinProjectSkill
      tags: [skills]
      responses:
        "204": { description: Unpinned }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/search:
    get:
      operationId: search
      tags: [search]
      summary: Hybrid search over tickets, epics, milestones and skills the caller may read
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [item, skill] } }
        - { name: project, in: query, schema: { type: string }, description: "Project key: its items and its skill chain" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResult" } } } }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Customer: { name: customer, in: path, required: true, schema: { type: string }, description: Customer key }
    Project: { name: project, in: path, required: true, schema: { type: string }, description: Project key }
    Skill: { name: skill, in: path, required: true, schema: { type: string }, description: Skill ID }
    Run: { name: run, in: path, required: true, schema: { type: string }, description: Run ID }
    PlannerSession: { name: session, in: path, required: true, schema: { type: string }, description: Planner session ID }
    Changeset: { name: changeset, in: path, required: true, schema: { type: string }, description: Changeset ID }
    Entry: { name: entry, in: path, required: true, schema: { type: string }, description: Knowledge entry ID }
    Provider: { name: provider, in: path, required: true, schema: { type: string, enum: [anthropic, openai, git] } }
    Item: { name: item, in: path, required: true, schema: { type: string }, description: "Item key, e.g. WEB-42" }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [invalid_argument, unauthenticated, forbidden, not_found, already_exists, conflict, internal]
        message: { type: string }

    Me:
      type: object
      additionalProperties: false
      required: [subject, email, name, groups, bindings]
      properties:
        subject: { type: string }
        email: { type: string }
        name: { type: string }
        groups: { type: array, items: { type: string } }
        bindings: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }

    Role:
      type: object
      additionalProperties: false
      required: [role, actions]
      properties:
        role: { type: string }
        actions: { type: array, items: { type: string } }
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Role" } } }

    RoleBinding:
      type: object
      additionalProperties: false
      required: [id, claim, value, role, scope, bootstrap]
      properties:
        id: { type: string }
        claim: { type: string }
        value: { type: string }
        role: { type: string, enum: [platform-admin, customer-admin, engineer, approver, viewer] }
        scope: { type: string, description: "platform, customer:<key> or project:<key>" }
        bootstrap: { type: boolean }
        created_at: { type: string, format: date-time }
    RoleBindingList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } } }
    CreateRoleBinding:
      type: object
      additionalProperties: false
      required: [claim, value, role, scope]
      properties:
        claim: { type: string }
        value: { type: string }
        role: { type: string }
        scope: { type: string }

    Customer:
      type: object
      additionalProperties: false
      required: [id, key, name, created_at, updated_at, version]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    CustomerList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Customer" } } }
    CreateCustomer:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
    UpdateCustomer:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: integer, format: int64 }

    Project:
      type: object
      additionalProperties: false
      required: [id, key, customer, name, description, created_at, updated_at, version]
      properties:
        id: { type: string }
        key: { type: string }
        customer: { type: string, description: Customer key }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Project" } } }
    CreateProject:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
    UpdateProject:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        description: { type: string }
        version: { type: integer, format: int64 }

    ItemKind: { type: string, enum: [milestone, epic, ticket] }
    ItemState:
      type: string
      enum: [open, backlog, ready, in_progress, waiting_for_answer, paused, done, cancelled]
    TicketType: { type: string, enum: [feature, bug, tech_debt, docs, spike] }
    Policy:
      type: object
      additionalProperties: false
      required: [review_mode, merge_mode]
      properties:
        review_mode: { type: string, enum: [agent, agent+human] }
        merge_mode: { type: string, enum: [auto, manual] }
    Item:
      type: object
      additionalProperties: false
      required: [id, key, project, kind, title, description, state, created_at, updated_at, version]
      properties:
        id: { type: string }
        key: { type: string }
        project: { type: string, description: Project key }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string }
        description: { type: string }
        state: { $ref: "#/components/schemas/ItemState" }
        stage: { type: string, description: Current pipeline stage while in progress }
        type: { $ref: "#/components/schemas/TicketType" }
        acceptance_criteria: { type: array, items: { type: string } }
