        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/KnowledgeKind" } }
        - { name: project, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchResult" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/customers/{customer}/knowledge/entries/{entry}:
