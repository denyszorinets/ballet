        group_by=run groups by the caller of the gateway: "run:<id>" for agent runs,
        "planner:<session>" for the planner.
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [ticket, model, run], default: ticket } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: ticket, in: query, schema: { type: string }, description: Only this ticket's usage }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageReport" } } } }
        default: { $ref: "#/components/responses/Error" }

