      summary: Approve the human stage the ticket waits in (humans, tracker.write)
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/FlowDecision" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/flow/reject:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    post:
      operationId: rejectFlowStage
      tags: [pipelines]
      summary: Reject the human stage the ticket waits in (humans, tracker.write)
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/FlowDecision" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/runs/{run}:
    parameters: [{ $ref: "#/components/parameters/Run" }]
    get:
      operationId: getRun
      tags: [runs]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/runs/{run}/logs:
    parameters: [{ $ref: "#/components/parameters/Run" }]
    get:
      operationId: getRunLogs
      tags: [runs]
      summary: The run's output after a sequence number
      parameters:
