        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunLogList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/runs/{run}/input:
    parameters: [{ $ref: "#/components/parameters/Run" }]
    post:
      operationId: sendRunInput
      tags: [runs]
      summary: Send a message or interrupt to a running coding-agent session (run.manage)
      description: >
        A message is delivered when the session's current turn ends; an
        interrupt stops the current turn first, then delivers the text, if
