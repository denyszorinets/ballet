openapi: 3.0.3
info:
  title: Ballet Core API
  version: v1
  description: |
    Stateless REST API of Ballet Core. All operations require an OIDC access
    token (`Authorization: Bearer …`) and are authorized through role
    bindings. Errors use the `Error` schema. Updates use optimistic
    concurrency through `version`.
servers:
  - url: /
security:
  - bearer: []

paths:
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: The caller and the role bindings that apply to them
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [access]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoleList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/role-bindings:
    get:
      operationId: listRoleBindings
      tags: [access]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RoleBindingList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRoleBinding
      tags: [access]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRoleBinding" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RoleBinding" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/role-bindings/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteRoleBinding
      tags: [access]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/customers:
    get:
      operationId: listCustomers
      tags: [tenancy]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCustomer
      tags: [tenancy]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCustomer" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/customers/{customer}:
    parameters: [{ $ref: "#/components/parameters/Customer" }]
    get:
      operationId: getCustomer
      tags: [tenancy]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCustomer
      tags: [tenancy]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCustomer" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/customers/{customer}/projects:
    parameters: [{ $ref: "#/components/parameters/Customer" }]
    get:
      operationId: listProjects
      tags: [tenancy]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      tags: [tenancy]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateProject" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: getProject
      tags: [tenancy]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [tenancy]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateProject" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/items:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listItems
      tags: [tracker]
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ItemKind" } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ItemState" } }
        - { name: epic, in: query, schema: { type: string }, description: Epic key }
        - { name: milestone, in: query, schema: { type: string }, description: Milestone key }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createItem
      tags: [tracker]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateItem" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/runnable:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listRunnable
      tags: [tracker]
      summary: Ready tickets whose blockers are all resolved
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/changesets:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listChangesets
      tags: [changesets]
      summary: The project's plan changesets, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ChangesetStatus" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChangesetList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: proposeChangeset
      tags: [changesets]
      summary: Propose planning changes for a human to approve
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProposeChangeset" } } }
      responses:
        "201": { description: Proposed, content: { application/json: { schema: { $ref: "#/components/schemas/Changeset" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/changesets/{changeset}:
    parameters: [{ $ref: "#/components/parameters/Changeset" }]
    get:
      operationId: getChangeset
      tags: [changesets]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Changeset" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/changesets/{changeset}/apply:
    parameters: [{ $ref: "#/components/parameters/Changeset" }]
    post:
      operationId: applyChangeset
      tags: [changesets]
      summary: Apply the approved operations atomically (humans only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApplyChangeset" } } }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Changeset" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/changesets/{changeset}/reject:
    parameters: [{ $ref: "#/components/parameters/Changeset" }]
    post:
      operationId: rejectChangeset
      tags: [changesets]
      summary: Reject the whole changeset (humans only)
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Changeset" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/planner/sessions:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listPlannerSessions
      tags: [planner]
      summary: The project's planner sessions, most recently active first
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlannerSessionList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPlannerSession
      tags: [planner]
      summary: Start a planner chat (send messages over the realtime API)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePlannerSession" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlannerSession" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/planner/sessions/{session}:
    parameters: [{ $ref: "#/components/parameters/PlannerSession" }]
    get:
      operationId: getPlannerSession
      tags: [planner]
      summary: A planner session with its full transcript
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlannerTranscript" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/runs:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    get:
      operationId: listRuns
      tags: [runs]
      summary: The ticket's runs, oldest first
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunList" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRun
      tags: [runs]
      summary: Queue a run of the ticket by hand (run.manage)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRun" } } }
      responses:
        "201": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/execution:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: getExecutionSettings
      tags: [runs]
      summary: How the project's runs execute (version 0 when never set)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionSettings" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setExecutionSettings
      tags: [runs]
      summary: Replace the project's execution settings (project.update)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetExecutionSettings" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExecutionSettings" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/reports:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    get:
      operationId: listReports
      tags: [runs]
      summary: What agent runs reported on the ticket, oldest first
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReportList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/questions:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    get:
      operationId: listQuestions
      tags: [runs]
      summary: Questions agent runs raised on the ticket, oldest first
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/assumptions:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listAssumptions
      tags: [runs]
      summary: The project's assumption register, newest first
      parameters:
        - { name: review, in: query, schema: { type: string, enum: [open, confirmed, rejected] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReportList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/assumptions/{report}/confirm:
    parameters: [{ name: report, in: path, required: true, schema: { type: string } }]
    post:
      operationId: confirmAssumption
      tags: [runs]
      summary: Confirm an assumption
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssumptionReview" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/assumptions/{report}/reject:
    parameters: [{ name: report, in: path, required: true, schema: { type: string } }]
    post:
      operationId: rejectAssumption
      tags: [runs]
      summary: Reject an assumption; creates follow-up work
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssumptionReview" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/pauses:
    get:
      operationId: listPauses
      tags: [runs]
      summary: Pauses of autonomous work the caller can see
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PauseList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/pause:
    put:
      operationId: pausePlatform
      tags: [runs]
      summary: Pause all autonomous work (run.manage at platform scope)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PauseInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pause" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: resumePlatform
      tags: [runs]
      summary: Resume all autonomous work
      responses:
        "204": { description: Resumed }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/kill:
    post:
      operationId: killPlatform
      tags: [runs]
      summary: Kill switch — pause everything and cancel every run in progress
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PauseInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KillResult" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/pause:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    put:
      operationId: pauseProject
      tags: [runs]
      summary: Pause the project's autonomous work (run.manage)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PauseInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pause" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: resumeProject
      tags: [runs]
      summary: Resume the project's autonomous work
      responses:
        "204": { description: Resumed }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/kill:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    post:
      operationId: killProject
      tags: [runs]
      summary: Kill switch — pause the project and cancel its runs in progress
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PauseInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KillResult" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/customers/{customer}/budget:
    parameters: [{ $ref: "#/components/parameters/Customer" }]
    get:
      operationId: getCustomerBudget
      tags: [usage]
      summary: The customer's token budgets and today's use (customer.read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setCustomerBudget
      tags: [usage]
      summary: Set the customer's token budgets (customer.update)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetBudget" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/budget:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: getProjectBudget
      tags: [usage]
      summary: The project's token budgets and today's use (tracker.read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setProjectBudget
      tags: [usage]
      summary: Set the project's token budgets (project.update)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetBudget" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/digest:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: getProjectDigest
      tags: [usage]
      summary: What happened in the project over a period (default the last 24 hours)
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time }, description: "Default: until minus 24 hours" }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: "Default: now" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Digest" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/questions/{question}/answer:
    parameters: [{ name: question, in: path, required: true, schema: { type: string } }]
    post:
      operationId: answerQuestion
      tags: [runs]
      summary: Answer an open question; a blocking question resumes the ticket's pipeline
      description: Needs tracker.write on the project. The answer is written to the knowledge base.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QuestionAnswer" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/questions/{question}/chat:
    parameters: [{ name: question, in: path, required: true, schema: { type: string } }]
    post:
      operationId: questionChat
      tags: [planner]
      summary: The question's sub-chat with the planner, started on first use
      description: >-
        Needs tracker.write. The session's planner knows the ticket, the question
        and the latest stage reports; talk to it with planner.send.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlannerSession" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/inbox:
    get:
      operationId: listInbox
      tags: [runs]
      summary: Open questions of every project the caller can read, most impactful first
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InboxList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/pull-request:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    get:
      operationId: getPullRequest
      tags: [runs]
      summary: The ticket's pull request as last seen (404 when none)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PullRequest" } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: openPullRequest
      tags: [runs]
      summary: Open (or find) the pull request of the ticket branch (tracker.write)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PullRequest" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/pull-request/refresh:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    post:
      operationId: refreshPullRequest
      tags: [runs]
      summary: Read the pull request's state from the forge now
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PullRequest" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/pull-request/merge:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    post:
      operationId: mergePullRequest
      tags: [runs]
      summary: Squash-merge the pull request (humans, tracker.write)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PullRequest" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/pipelines:
    parameters: [{ $ref: "#/components/parameters/Project" }]
    get:
      operationId: listPipelines
      tags: [pipelines]
      summary: Latest version of each pipeline; Ballet's template as version 0 until a default is saved
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PipelineList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/pipelines/{name}:
    parameters:
      - { $ref: "#/components/parameters/Project" }
      - { name: name, in: path, required: true, schema: { type: string }, description: '"default" or a ticket type' }
    get:
      operationId: getPipeline
      tags: [pipelines]
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 0 }, description: "0 or absent: the latest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pipeline" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: savePipeline
      tags: [pipelines]
      summary: Save a new version after the version read (project.update)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SavePipeline" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Pipeline" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/projects/{project}/pipelines/{name}/versions:
    parameters:
      - { $ref: "#/components/parameters/Project" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: listPipelineVersions
      tags: [pipelines]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PipelineList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/pipelines/parse:
    post:
      operationId: parsePipelineYAML
      tags: [pipelines]
      summary: Parse and validate pipeline YAML
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [yaml], properties: { yaml: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ParsedPipeline" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/pipelines/render:
    post:
      operationId: renderPipelineYAML
      tags: [pipelines]
      summary: Render a pipeline definition as YAML
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [definition], properties: { definition: { $ref: "#/components/schemas/PipelineDefinition" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: false, required: [yaml], properties: { yaml: { type: string } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/flow:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    get:
      operationId: getFlow
      tags: [pipelines]
      summary: The ticket's way through its pipeline (404 before it started)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/flow/start:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    post:
      operationId: startFlow
      tags: [pipelines]
      summary: Start a ready ticket's pipeline by hand (run.manage)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/items/{item}/flow/approve:
    parameters: [{ $ref: "#/components/parameters/Item" }]
    post:
      operationId: approveFlowStage
