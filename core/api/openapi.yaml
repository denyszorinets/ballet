        type: { type: string, enum: [blocks, relates], description: "blocks: from blocks to" }
    ChangesetOperation:
      type: object
      additionalProperties: false
      required: [kind]
      description: Exactly the payload matching kind is set.
      properties:
        kind: { type: string, enum: [create_item, update_item, add_dependency] }
        ref: { type: string, description: "create_item: name later operations use as $ref" }
        create: { $ref: "#/components/schemas/ChangesetCreateItem" }
        update: { $ref: "#/components/schemas/ChangesetUpdateItem" }
        dependency: { $ref: "#/components/schemas/ChangesetDependency" }
