    get:
      operationId: getKnowledgeEntry
      tags: [knowledge]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEntry" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateKnowledgeEntry
      tags: [knowledge]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateKnowledgeEntry" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEntry" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/customers/{customer}/knowledge/entries/{entry}/versions:
    parameters: [{ $ref: "#/components/parameters/Customer" }, { $ref: "#/components/parameters/Entry" }]
    get:
      operationId: listKnowledgeVersions
      tags: [knowledge]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeVersionList" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/skills:
    get:
      operationId: listSkills
      tags: [skills]
