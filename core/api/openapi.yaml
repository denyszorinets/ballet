      type: object
      additionalProperties: false
      required: [id, project, title, summary, status, operations, proposed_by, created_at, approved, results, version]
      properties:
        id: { type: string }
        project: { type: string }
        title: { type: string }
        summary: { type: string, description: Markdown }
        status: { $ref: "#/components/schemas/ChangesetStatus" }
        operations: { type: array, items: { $ref: "#/components/schemas/ChangesetOperation" } }
        proposed_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        decided_by: { $ref: "#/components/schemas/Actor" }
        decided_at: { type: string, format: date-time }
        approved: { type: array, items: { type: integer }, description: 0-based indices of applied operations }
        results: { type: array, items: { $ref: "#/components/schemas/ChangesetResult" }, description: "Per operation once applied; empty before" }
        version: { type: integer, format: int64 }
